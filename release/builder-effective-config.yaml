directories:
  output: release
  buildResources: build
appId: com.skenterprises.skai
productName: SKAI
copyright: Copyright © 2026 Sumeet Kumar | SK Enterprises. All Rights Reserved.
forceCodeSigning: false
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
      - assets/**/*
      - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/skai.ico
  artifactName: SKAI_Setup_v${version}.${ext}
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SKAI
  installerIcon: assets/skai.ico
  uninstallerIcon: assets/skai.ico
  uninstallDisplayName: SKAI — Powered by SK Enterprises
electronVersion: 33.4.11
