  <circle cx="256" cy="256" r="140" fill="#00f5d4" fill-opacity="0.06" stroke="#00f5d4" stroke-width="2" filter="url(#glow)"/>
  <path d="M 220 180 C 220 160, 160 160, 160 195 C 160 230, 230 235, 230 275 C 230 320, 150 320, 150 290" 
